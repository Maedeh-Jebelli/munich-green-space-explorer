<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Munich Green Space Explorer</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <h1>Munich Green Space Explorer</h1>

    <p>
        Explore urban green spaces in Munich through an interactive map.
    </p>

    <div id="statistics">
        <div>
            <strong id="total-count">0</strong>
            <span>Green Spaces</span>
        </div>

        <div>
            <strong id="park-count">0</strong>
            <span>Parks</span>
        </div>

        <div>
            <strong id="garden-count">0</strong>
            <span>Gardens</span>
        </div>
    </div>

    <div id="filters">
    <span>Show:</span>

    <button id="show-all" class="active">All</button>
    <button id="show-parks">Parks</button>
    <button id="show-gardens">Gardens</button>
</div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
